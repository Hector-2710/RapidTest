name: Publish to PyPI


on:
  release:
    types: [published]

jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # GitHub debe encontrar este secreto. 
          # Si falla, es que el secreto no existe con este nombre exacto.
          password: ${{ secrets.PYPI_API_TOKEN }}