name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    # Eliminamos 'permissions' para que use solo el token
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Build package
        run: |
          pip install build
          python -m build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # GitHub debe encontrar este secreto. 
          # Si falla, es que el secreto no existe con este nombre exacto.
          password: ${{ secrets.PYPI_API_TOKEN }}