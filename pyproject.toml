[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapidtest"
version = "0.9.1"
authors = [
  { name="Hector Rosales", email="h.rosales01@ufromail.cl" },
]
description = "A lightweight library for REST API testing with HTTP, ASGI, and performance testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["testing", "api", "rest", "http", "fastapi", "asgi", "httptest", "performance", "load-testing"]
dependencies = [
    "httpx>=0.24.0",
    "faker>=13.0.0",
]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
rapidtest = "rapidtest.cli:main"

[project.urls]
"Homepage" = "https://github.com/Hector-2710/rapidtest"
"Documentation" = "https://rapidtest.readthedocs.io"
"Bug Tracker" = "https://github.com/Hector-2710/rapidtest/issues"
"Source Code" = "https://github.com/Hector-2710/rapidtest"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-awesome-pages-plugin>=2.8.0",
]

[tool.setuptools]
packages = ["rapidtest"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
python_version = "3.10"
exclude = ["test/"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
addopts = ["-q"]
